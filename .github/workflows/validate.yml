name: Validate labs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install lab validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential nginx

      - name: Run lab validation
        run: ./validate.sh
